<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPOS Cafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
  <div class="flex h-screen overflow-hidden">
    
    <!-- Kolom Kiri: Menu Cafe -->
    <div class="w-2/3 p-6 overflow-y-auto">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-slate-900">☕ EPOS Cafe</h1>
        <button onclick="fetchMenu()" class="text-sm bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded-lg">🔄 Refresh Menu</button>
      </div>

      <div id="menu-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <div class="col-span-full text-center py-12 text-slate-500">Memuat menu...</div>
      </div>
    </div>

    <!-- Kolom Kanan: Ringkasan Pesanan / Kasir -->
    <div class="w-1/3 bg-white border-l border-slate-200 flex flex-col justify-between p-6 shadow-lg">
      <div>
        <h2 class="text-xl font-bold mb-4 border-b pb-2">Pesanan Baru</h2>
        
        <div class="mb-4">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Nama Pelanggan</label>
          <input type="text" id="customer-name" placeholder="opsional..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <div id="cart-list" class="space-y-3 max-h-[40vh] overflow-y-auto pr-1">
          <p class="text-sm text-slate-400 text-center py-8">Keranjang belanja masih kosong.</p>
        </div>
      </div>

      <div class="border-t pt-4">
        <div class="flex justify-between text-base font-medium mb-2">
          <span>Total:</span>
          <span id="cart-total" class="font-bold text-amber-600">Rp 0</span>
        </div>

        <div class="mb-4">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Metode Pembayaran</label>
          <select id="payment-method" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
            <option value="CASH">Tunai (Cash)</option>
            <option value="QRIS">QRIS / E-Wallet</option>
            <option value="DEBIT">Kartu Debit</option>
          </select>
        </div>

        <button onclick="checkout()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3 rounded-xl transition shadow-md">
          Bayar & Proses Pesanan
        </button>
      </div>
    </div>

  </div>

  <script>
    let cart = [];
    let menuData = [];

    async function fetchMenu() {
      try {
        const res = await fetch('/api/menu');
        const result = await res.json();
        if (result.success) {
          menuData = result.data;
          renderMenu();
        }
      } catch (err) {
        console.error("Gagal mengambil menu:", err);
      }
    }

    function renderMenu() {
      const container = document.getElementById('menu-grid');
      container.innerHTML = '';

      menuData.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between";
        card.onclick = () => addToCart(item);
        card.innerHTML = `
          <div>
            <span class="text-xs font-semibold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full">${item.category || 'Menu'}</span>
            <h3 class="font-bold text-slate-800 mt-2">${item.name}</h3>
          </div>
          <p class="text-sm font-semibold text-slate-600 mt-4">Rp ${item.price.toLocaleString('id-ID')}</p>
        `;
        container.appendChild(card);
      });
    }

    function addToCart(item) {
      const existing = cart.find(c => c.id === item.id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
      }
      renderCart();
    }

    function updateQty(id, delta) {
      const idx = cart.findIndex(c => c.id === id);
      if (idx !== -1) {
        cart[idx].qty += delta;
        if (cart[idx].qty <= 0) cart.splice(idx, 1);
      }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-list');
      const totalEl = document.getElementById('cart-total');

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-sm text-slate-400 text-center py-8">Keranjang belanja masih kosong.</p>`;
        totalEl.innerText = 'Rp 0';
        return;
      }

      container.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;

        const row = document.createElement('div');
        row.className = "flex items-center justify-between text-sm bg-slate-50 p-2.5 rounded-lg border border-slate-100";
        row.innerHTML = `
          <div>
            <div class="font-medium text-slate-800">${item.name}</div>
            <div class="text-xs text-slate-500">Rp ${item.price.toLocaleString('id-ID')} x ${item.qty}</div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="updateQty('${item.id}', -1)" class="w-6 h-6 flex items-center justify-center bg-slate-200 rounded text-slate-700 font-bold">-</button>
            <span class="w-4 text-center font-medium">${item.qty}</span>
            <button onclick="updateQty('${item.id}', 1)" class="w-6 h-6 flex items-center justify-center bg-slate-200 rounded text-slate-700 font-bold">+</button>
          </div>
        `;
        container.appendChild(row);
      });

      totalEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    async function checkout() {
      if (cart.length === 0) return alert('Keranjang masih kosong!');

      const customerName = document.getElementById('customer-name').value;
      const paymentMethod = document.getElementById('payment-method').value;
      const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const payload = {
        customerName,
        paymentMethod,
        totalAmount,
        items: cart.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty }))
      };

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alert('Transaksi berhasil disimpan!');
          cart = [];
          document.getElementById('customer-name').value = '';
          renderCart();
        } else {
          alert('Gagal menyimpan transaksi: ' + result.message);
        }
      } catch (err) {
        alert('Terjadi kesalahan koneksi.');
      }
    }

    fetchMenu();
  </script>
</body>
</html>
